:root { background: transparent; --page-width: 400; --page-height: 283; font-family: Arial, "Microsoft YaHei", sans-serif; }
html, body { height: 100%; background: transparent; }
.room { height: 100dvh; min-height: 0; padding: 12px 16px; grid-template-rows: 20px minmax(0,1fr) 44px; gap: 8px; }
.book-header { grid-template-columns: 1fr auto; }
.book-header span { color: #4c585b; font-size: 9px; letter-spacing: .12em; }
.stage { padding: 0; }
.stage::after { display: none; }
.book-rig { width: min(100%, calc((100dvh - 104px) * 2.8268551237)); height: calc(100dvh - 104px); }
.book-page, .cover, .back-cover { background: #fff; padding: 0; }
.book-page::after { content: none; }
.book-page img { display: block; width: 100%; height: 100%; object-fit: contain; user-select: none; }
.book { filter: drop-shadow(0 8px 12px rgb(20 25 25 / 18%)); }
.controls { max-width: 480px; gap: 12px; }
.controls button { height: 40px; background: rgb(255 255 255 / 35%); }
.controls button:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
.status small { font-family: Arial, "Microsoft YaHei", sans-serif; color: #4c585b; }
@media (max-width: 600px) {
 .room { padding: 10px; }
 .book-header span:first-child { display: inline; }
 .book-rig { width: min(100%, calc((100dvh - 104px) * 1.4134275618)); }
 .status small { font-size: 9px; }
}
</style>

<script src="flipbook.js"></script>
<script>
// Embedded-view handshake; the standalone book and its turn engine remain unchanged.
(() => {
  if (window.parent === window) return;
  let status = 'loading';
  const notify = (type) => window.parent.postMessage({ channel: 'portfolio-book', type }, window.location.origin);
  window.addEventListener('message', (event) => {
    if (event.source !== window.parent || event.origin !== window.location.origin) return;
    if (event.data?.channel === 'portfolio-book' && event.data.type === 'probe' && status !== 'loading') notify(status);
  });
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { event.preventDefault(); notify('close'); }
  });
  const report = (type) => { status = type; notify(type); };
  try {
    if (pageFlip.getPageCount() !== document.querySelectorAll('.book-page').length) throw new Error('Book initialization incomplete');
    document.querySelector('.book-page img').decode().then(() => report('ready'), () => report('error'));
  } catch {
    report('error');
  }
})();
</script>
